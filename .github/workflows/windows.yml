# Exécutable Windows autonome (sans Python à installer), fabriqué par PyInstaller.
# Lancé à la main (onglet Actions → « Exécutable Windows » → Run workflow) ou par un tag v* (publie une release).
# Deux jobs de fabrication : windows (Python 3.12, Windows 10/11) et windows7 (Python 3.8 32 bits, Windows 7 SP1),
# puis, sur un tag, un job release qui publie les deux archives ensemble.
# Sécurité : actions figées sur un commit (le numéro de version en commentaire), jeton en lecture seule sauf pour le job
# release, jeton non gardé dans le dépôt cloné.
name: Exécutable Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Tests de la page retirés de l'exécutable
        shell: pwsh
        run: Remove-Item -Recurse -Force web\tests

      - name: Fabrication
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --onefile --console --name MonitoringSat --paths . --add-data "web;web" --add-data "config.example.toml;." packaging/monitoring_sat.py

      - name: Essai de l'exécutable
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force essai
          Copy-Item dist\MonitoringSat.exe $dir
          $p = Start-Process -FilePath "$dir\MonitoringSat.exe" -ArgumentList "--no-open" -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8080/api/status -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if ($ok) { Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing | Out-Null }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "le service ne répond pas"; exit 1 }
          if (-not (Test-Path "$dir\config.toml")) { Write-Error "config.toml non créé"; exit 1 }

      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force MonitoringSat | Out-Null
          Copy-Item dist\MonitoringSat.exe, packaging\LISEZMOI-Windows.txt MonitoringSat
          Compress-Archive -Path MonitoringSat -DestinationPath MonitoringSat-Windows.zip

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: MonitoringSat-Windows
          path: MonitoringSat-Windows.zip


  # Même exécutable pour Windows 7 SP1 : Python 3.9 et suivants ne le prennent plus en charge (api-ms-win-core-path
  # manquante). Python 3.8 en 32 bits (tourne sur Windows 7 32 et 64 bits), tomli à la place de tomllib (3.11),
  # PyInstaller 5.13.2, dernière version 5.x. Le runner est un Windows Server récent : l'essai prouve que l'exécutable
  # fonctionne, pas qu'il démarre sous Windows 7.
  windows7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.8"
          architecture: x86

      - name: Dépendance (tomli, Python < 3.11)
        run: python -m pip install tomli==2.0.1

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Tests de la page retirés de l'exécutable
        shell: pwsh
        run: Remove-Item -Recurse -Force web\tests

      - name: Fabrication
        run: |
          python -m pip install pyinstaller==5.13.2
          pyinstaller --noconfirm --onefile --console --name MonitoringSat --paths . --add-data "web;web" --add-data "config.example.toml;." packaging/monitoring_sat.py

      - name: Essai de l'exécutable
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force essai
          Copy-Item dist\MonitoringSat.exe $dir
          $p = Start-Process -FilePath "$dir\MonitoringSat.exe" -ArgumentList "--no-open" -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8080/api/status -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if ($ok) { Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing | Out-Null }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "le service ne répond pas"; exit 1 }
          if (-not (Test-Path "$dir\config.toml")) { Write-Error "config.toml non créé"; exit 1 }

      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force MonitoringSat | Out-Null
          Copy-Item dist\MonitoringSat.exe, packaging\LISEZMOI-Windows.txt, packaging\LISEZMOI-Windows7.txt MonitoringSat
          Compress-Archive -Path MonitoringSat -DestinationPath MonitoringSat-Windows7.zip

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: MonitoringSat-Windows7
          path: MonitoringSat-Windows7.zip

  # Une seule release avec les deux archives, une fois les deux fabriquées et essayées. Seul job à pouvoir écrire.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # pas sur un lancement à la main depuis un tag
    needs: [windows, windows7]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          merge-multiple: true

      - name: Sommes de contrôle
        run: sha256sum MonitoringSat-Windows.zip MonitoringSat-Windows7.zip > SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            MonitoringSat-Windows.zip
            MonitoringSat-Windows7.zip
            SHA256SUMS.txt
